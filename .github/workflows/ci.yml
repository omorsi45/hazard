name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned Python test tools
        run: python -m pip install pytest==8.4.2 coverage==7.10.7
      - name: Build
        run: go build ./...
      - name: Test
        env:
          HAZARD_REQUIRE_PYTEST: '1'
          HAZARD_TEST_PYTHON: python
        run: go test ./... -timeout 900s
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
